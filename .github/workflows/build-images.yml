# =============================================================================
# Hardened container image build
# =============================================================================
# Builds and publishes the downstream container image to the GitHub Container
# Registry. The image name is derived from the repository, so it tracks a
# rename without editing this file.
#
# Triggers
#   push on main           publishes :edge and :sha-<short>
#   tag v*                 publishes :vX.Y.Z, :X.Y.Z and :latest
#   workflow_dispatch      manual build against an arbitrary ref
#
# Supply chain
#   The manifest job attaches a build provenance attestation to the published
#   digest. Base images are pinned through build arguments and no package index
#   is refreshed during the build.
# =============================================================================

name: Build Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag or ref to build (defaults to the triggering ref)'
        required: false
        type: string
      push_latest:
        description: 'Also move the latest tag'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR rejects uppercase characters in a repository name, and the owner
  # portion of github.repository is not guaranteed to be lowercase, so the
  # image reference is built from the lowercased repository full name.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Prepare build metadata
        id: meta
        run: |
          ref="${{ github.event.inputs.release_tag || github.ref_name }}"
          version="$(VERSION="${ref}" bash .github/scripts/resolve-version.sh)"
          # Lowercase once here because GHCR rejects uppercase path segments.
          image="$(printf '%s/%s' "${REGISTRY}" "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=${version}"
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "image=${image}"
          } >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.hardened
          platforms: ${{ matrix.platform }}
          push: true
          # Per-architecture tags are intermediate inputs to the manifest job,
          # which publishes the attested multi-architecture digest. Attestation
          # and SBOM generation therefore happen once, on the final manifest,
          # instead of being duplicated for each architecture.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            OCI_URL=${{ github.server_url }}/${{ github.repository }}
            OCI_VENDOR=${{ github.repository_owner }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Report digest
        run: |
          echo "${{ matrix.arch }} digest: ${{ steps.build.outputs.digest }}"

  manifest:
    name: Publish multi-architecture manifest
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      image: ${{ steps.tags.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Prepare tags
        id: tags
        run: |
          version="$(VERSION="${{ github.event.inputs.release_tag || github.ref_name }}" bash .github/scripts/resolve-version.sh)"
          short="$(git rev-parse --short=7 HEAD)"
          # Lowercase once here because GHCR rejects uppercase path segments.
          image="$(printf '%s/%s' "${REGISTRY}" "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=${version}"
            echo "short=${short}"
            echo "image=${image}"
          } >>"$GITHUB_OUTPUT"

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble manifest
        id: manifest
        env:
          # A tag build or an explicit request moves latest; a main build moves
          # edge. Resolving both flags here keeps the tag decisions in one place
          # instead of interleaving shell tests with template expressions.
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          PUSH_LATEST: ${{ github.event.inputs.push_latest }}
        run: |
          image="${{ steps.tags.outputs.image }}"
          version="${{ steps.tags.outputs.version }}"
          short="${{ steps.tags.outputs.short }}"

          docker buildx imagetools create \
            --tag "${image}:${version}" \
            --tag "${image}:sha-${short}" \
            "${image}:${version}-amd64" \
            "${image}:${version}-arm64"

          if [ "${REF_TYPE}" = "tag" ] || [ "${PUSH_LATEST}" = "true" ]; then
            docker buildx imagetools create --tag "${image}:latest" "${image}:${version}"
          fi

          if [ "${REF}" = "refs/heads/main" ]; then
            docker buildx imagetools create --tag "${image}:edge" "${image}:${version}"
          fi

          # Read the manifest digest through the JSON form so the value is the
          # registry's own digest rather than a locally computed one.
          digest="$(docker buildx imagetools inspect "${image}:${version}" \
            --format '{{json .Manifest}}' \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          echo "digest=${digest}" >>"$GITHUB_OUTPUT"

      # GitHub persists attestations only for public repositories and for
      # organization-owned private ones. A private repository under a user
      # account is rejected, and that rejection must not fail a run whose image
      # has already been pushed. The step is optional: it records a warning and
      # the published digest keeps its tags.
      - name: Attest build provenance
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Report attestation outcome
        if: steps.attest.outcome == 'failure'
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          echo "::warning::Build provenance attestation was not persisted."
          echo "GitHub supports attestations only for public or organization-owned repositories."
          echo "The image at ${IMAGE} is published and tagged regardless."

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: manifest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compose release notes
        id: notes
        env:
          # The manifest job publishes the lowercase image reference it tagged.
          IMAGE: ${{ needs.manifest.outputs.image }}
          UPSTREAM_REPOSITORY: TokenFlux/TokenRouter
          # Reading the upstream tag needs an authenticated request.
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # A mirrored upstream tag names the release it came from. A tag pushed
          # by hand has no upstream counterpart, so the note states only that the
          # image tracks upstream at the tagged commit.
          if gh api "repos/${UPSTREAM_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            origin_note="This release mirrors upstream ${UPSTREAM_REPOSITORY} tag \`${tag}\`."
          else
            origin_note="This release tracks ${UPSTREAM_REPOSITORY} at the tagged commit."
          fi
          # The terminator is unindented and the body is written with printf, so
          # the published notes carry no leading whitespace from this file.
          {
            printf '## Container image\n\n'
            printf '```\n'
            printf 'docker pull %s:%s\n' "${IMAGE}" "${tag}"
            printf '```\n\n'
            printf 'Multi-architecture manifest: linux/amd64, linux/arm64.\n\n'
            printf '%s\n' "${origin_note}"
          } >notes.md
          echo "path=notes.md" >>"$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag || gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
