# =============================================================================
# Hardened container image build
# =============================================================================
# Builds and publishes the downstream TokenRouter image.
#
# Triggers
#   push on main           publishes :edge and :sha-<short>
#   tag v*                 publishes :vX.Y.Z, :X.Y.Z and :latest
#   workflow_dispatch      manual build against an arbitrary ref
#
# Supply chain
#   Every published image receives an SBOM and a provenance attestation. The
#   build is reproducible: base images are pinned through build arguments and
#   no package index is refreshed during the build.
# =============================================================================

name: Build Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag or ref to build (defaults to the triggering ref)'
        required: false
        type: string
      push_latest:
        description: 'Also move the latest tag'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tokenrouter-hardened

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Prepare build metadata
        id: meta
        run: |
          ref="${{ github.event.inputs.release_tag || github.ref_name }}"
          version="$(VERSION="${ref}" bash .github/scripts/resolve-version.sh)"
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.hardened
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            OCI_URL=${{ github.server_url }}/${{ github.repository }}
            OCI_VENDOR=${{ github.repository_owner }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Report digest
        run: |
          echo "${{ matrix.arch }} digest: ${{ steps.build.outputs.digest }}"

  manifest:
    name: Publish multi-architecture manifest
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Prepare tags
        id: tags
        run: |
          version="$(VERSION="${{ github.event.inputs.release_tag || github.ref_name }}" bash .github/scripts/resolve-version.sh)"
          short="$(git rev-parse --short=7 HEAD)"
          {
            echo "version=${version}"
            echo "short=${short}"
          } >>"$GITHUB_OUTPUT"

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble manifest
        id: manifest
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          version="${{ steps.tags.outputs.version }}"
          short="${{ steps.tags.outputs.short }}"

          docker buildx imagetools create \
            --tag "${image}:${version}" \
            --tag "${image}:sha-${short}" \
            "${image}:${version}-amd64" \
            "${image}:${version}-arm64"

          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event.inputs.push_latest }}" = "true" ]; then
            docker buildx imagetools create --tag "${image}:latest" "${image}:${version}"
          fi

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker buildx imagetools create --tag "${image}:edge" "${image}:${version}"
          fi

          digest="$(docker buildx imagetools inspect "${image}:${version}" --format '{{json .Manifest}}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          echo "digest=${digest}" >>"$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: manifest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compose release notes
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          cat >notes.md <<EOF
          ## Container image

          \`\`\`
          docker pull ${REGISTRY}/${IMAGE_NAME}:${tag}
          \`\`\`

          Multi-architecture manifest: linux/amd64, linux/arm64.
          SBOM and provenance attestations are attached to the registry digest.

          This release mirrors upstream TokenFlux/TokenRouter tag \`${tag}\`.
          EOF
          echo "path=notes.md" >>"$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag || gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
