# =============================================================================
# Upstream synchronisation
# =============================================================================
# Keeps the vendored copy of TokenFlux/TokenRouter in this repository current.
#
# Modes
#   scheduled  Nightly fast-forward attempt; opens or refreshes a sync pull
#              request when upstream advanced.
#   release    Runs on an upstream tag; mirrors the tag and dispatches the image
#              build for that revision.
#   manual     workflow_dispatch with the option to force a full fetch.
#
# Guarantees
#   Files listed under sync.preserveLocalPaths in .upstream-sync.json are never
#   overwritten. When upstream edits one of those paths the job fails its
#   conflict gate and opens a labelled pull request for manual reconciliation,
#   so CI keeps the merge blocked until a human resolves it.
# =============================================================================

name: Upstream Sync

on:
  schedule:
    # 03:17 UTC daily. Off-peak and deliberately not on the hour to avoid the
    # busiest window of the shared GitHub-hosted runner pool.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Fetch full upstream history instead of a shallow fetch'
        type: boolean
        default: false
      mode:
        description: 'Sync mode'
        type: choice
        options: [pull-request, direct-commit]
        default: pull-request
  repository_dispatch:
    types: [upstream-release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: TokenFlux/TokenRouter
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: sync/upstream-main

jobs:
  sync:
    name: Synchronise upstream sources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
      conflicted: ${{ steps.sync.outputs.conflicted }}
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"

      - name: Resolve upstream tip
        id: upstream
        run: |
          git fetch --no-tags --prune upstream "${UPSTREAM_BRANCH}"
          echo "sha=$(git rev-parse upstream/${UPSTREAM_BRANCH})" >>"$GITHUB_OUTPUT"

      - name: Prepare sync branch
        id: prepare
        run: |
          git checkout -B "${SYNC_BRANCH}" "origin/${SYNC_BRANCH}" 2>/dev/null || git checkout -B "${SYNC_BRANCH}" main
          # Rebase the reusable sync branch onto the local base branch so that a
          # stale pull request never carries an obsolete base. A conflict here
          # means the branch and main disagree on a file both changed; aborting
          # silently would report "nothing to sync" and skip the whole pipeline,
          # so the conflict is aborted to leave a clean tree but reported as a
          # result the caller must act on.
          if git rebase main; then
            echo "rebase=clean" >>"$GITHUB_OUTPUT"
          else
            conflicting="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            git rebase --abort
            echo "rebase=conflict" >>"$GITHUB_OUTPUT"
            echo "conflicting=${conflicting}" >>"$GITHUB_OUTPUT"
            echo "::warning::Rebase onto main conflicted on:${conflicting} The sync branch was reset to main so mirroring can still run."
            # A conflicted sync branch cannot carry this run's changes, so restart
            # it from main to keep the branch usable for the tag mirror below.
            git checkout -B "${SYNC_BRANCH}" main
          fi

      - name: Apply upstream snapshot
        id: sync
        continue-on-error: true
        env:
          MIRROR_BRANCH: ${{ env.SYNC_BRANCH }}
          UPSTREAM_REMOTE: upstream
          UPSTREAM_BRANCH: ${{ env.UPSTREAM_BRANCH }}
        run: |
          set +e
          bash .github/scripts/sync-upstream.sh
          status=$?
          set -e
          # A non-zero exit reports a preserved-path conflict; the check step
          # already stopped, so the branch is still committed and reviewed.
          echo "conflicted=$([ $status -ne 0 ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          if [ -f sync-report.json ]; then
            echo "upstream_sha=$(python3 -c 'import json;print(json.load(open("sync-report.json"))["upstreamSha"])')" >>"$GITHUB_OUTPUT"
          fi
          # Stage everything the sync produced, then compare against HEAD. The
          # state file is untracked on a fresh branch, so a plain `git diff` would
          # report no change and the commit step would be skipped. The report is
          # gitignored and never becomes part of the commit.
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Commit synchronised sources
        if: steps.sync.outputs.changed == 'true'
        run: |
          short="${GITHUB_SHA::7}"
          # The state file is tracked on the sync branch so the next run reads the
          # upstream revision this branch last consumed instead of guessing.
          git commit -m "chore(sync): advance vendored upstream to ${short}" \
                     -m "Automated mirror update produced by .github/workflows/upstream-sync.yml." \
                     -m "Upstream-Revision: ${{ steps.upstream.outputs.sha }}"

      - name: Push sync branch
        if: steps.sync.outputs.changed == 'true'
        run: |
          git push --force-with-lease origin "${SYNC_BRANCH}"

      - name: Open or refresh sync pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICTED: ${{ steps.sync.outputs.conflicted }}
        run: |
          title="chore(sync): upstream ${UPSTREAM_REPOSITORY} -> ${GITHUB_RUN_ID}"
          body_file="$(mktemp)"
          {
            echo "## Automated upstream synchronisation"
            echo
            echo "Upstream revision: \`${{ steps.upstream.outputs.sha }}\`"
            echo
            if [ "${CONFLICTED}" = "true" ]; then
              echo "### Review required"
              echo
              echo "Upstream modified at least one path this repository preserves locally."
              echo "Resolve the conflict in \`sync-report.json\` before merging; the \`sync-conflict\` label keeps CI blocked."
            else
              echo "No preserved path was touched by upstream, so this pull request is expected to merge cleanly."
            fi
            echo
            echo "Generated by \`.github/workflows/upstream-sync.yml\`."
          } >"$body_file"

          existing="$(gh pr list --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number' || true)"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "${title}" --body-file "${body_file}"
          else
            gh pr create --base main --head "${SYNC_BRANCH}" \
              --title "${title}" --body-file "${body_file}" \
              --label upstream-sync || true
          fi

          if [ "${CONFLICTED}" = "true" ]; then
            gh pr edit "${SYNC_BRANCH}" --add-label sync-conflict || true
          fi

      - name: Summary
        run: |
          {
            echo "### Upstream sync"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Upstream revision | \`${{ steps.upstream.outputs.sha }}\` |"
            echo "| Changed | ${{ steps.sync.outputs.changed }} |"
            echo "| Conflict | ${{ steps.sync.outputs.conflicted }} |"
          } >>"$GITHUB_STEP_SUMMARY"

  mirror-tags:
    name: Mirror upstream release tags
    runs-on: ubuntu-latest
    needs: sync
    # Tag mirroring is independent of whether the source snapshot changed: a
    # manual run or a scheduled sweep must still pick up upstream releases that
    # were tagged since the last pass. Only a hard failure of the sync job, or a
    # run that produced no usable revision, skips this.
    if: >-
      ${{
        always() &&
        needs.sync.result == 'success' &&
        github.event_name != 'pull_request'
      }}
    outputs:
      tags: ${{ steps.tags.outputs.created }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Annotated tags need a committer identity. This job creates its own
      # checkout, so it inherits no identity from the synchronise job.
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # The script adds the remote itself when it is absent, so an unconditional
      # `git remote add` would fail on a runner that already has it configured.
      - id: tags
        env:
          PUSH_TAGS: 'true'
          # Upstream carries years of release tags. Mirroring the newest few per
          # run keeps a first sync from queueing an image build for every tag at
          # once, and later runs continue from the backlog. Set to 0 to mirror
          # every outstanding tag in one pass.
          TAG_LIMIT: '5'
        run: |
          created="$(bash .github/scripts/sync-tags.sh)"
          echo "created<<EOF" >>"$GITHUB_OUTPUT"
          echo "${created}" >>"$GITHUB_OUTPUT"
          echo "EOF" >>"$GITHUB_OUTPUT"

  dispatch-builds:
    name: Dispatch release builds
    runs-on: ubuntu-latest
    needs: mirror-tags
    if: ${{ needs.mirror-tags.outputs.tags != '' }}
    steps:
      - name: Trigger image build per mirrored tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.mirror-tags.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            gh workflow run build-images.yml --ref "${tag}" -f release_tag="${tag}"
          done <<<"${TAGS}"
