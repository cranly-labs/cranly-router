# =============================================================================
# Upstream synchronisation
# =============================================================================
# Keeps the vendored copy of TokenFlux/TokenRouter in this repository current.
#
# Modes
#   scheduled  Nightly fast-forward attempt; opens or refreshes a sync pull
#              request when upstream advanced.
#   release    Runs on an upstream tag; mirrors the tag and dispatches the image
#              build for that revision.
#   manual     workflow_dispatch with the option to force a full fetch.
#
# Guarantees
#   Files listed under sync.preserveLocalPaths in .upstream-sync.json are never
#   overwritten. When upstream edits one of those paths the job fails its
#   conflict gate and opens a labelled pull request for manual reconciliation,
#   so CI keeps the merge blocked until a human resolves it.
# =============================================================================

name: Upstream Sync

on:
  schedule:
    # 03:17 UTC daily. Off-peak and deliberately not on the hour to avoid the
    # busiest window of the shared GitHub-hosted runner pool.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Fetch full upstream history instead of a shallow fetch'
        type: boolean
        default: false
      mode:
        description: 'Sync mode'
        type: choice
        options: [pull-request, direct-commit]
        default: pull-request
  repository_dispatch:
    types: [upstream-release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: TokenFlux/TokenRouter
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: sync/upstream-main

jobs:
  sync:
    name: Synchronise upstream sources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      upstream_sha: ${{ steps.upstream.outputs.sha }}
      conflicted: ${{ steps.sync.outputs.conflicted }}
      status: ${{ steps.sync.outputs.status }}
      merged: ${{ steps.automerge.outputs.merged }}
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"

      - name: Resolve upstream tip
        id: upstream
        run: |
          git fetch --no-tags --prune upstream "${UPSTREAM_BRANCH}"
          echo "sha=$(git rev-parse upstream/${UPSTREAM_BRANCH})" >>"$GITHUB_OUTPUT"

      - name: Prepare sync branch
        id: prepare
        run: |
          git checkout -B "${SYNC_BRANCH}" "origin/${SYNC_BRANCH}" 2>/dev/null || git checkout -B "${SYNC_BRANCH}" main
          # Rebase the reusable sync branch onto the local base branch so that a
          # stale pull request never carries an obsolete base. A conflict here
          # means the branch and main disagree on a file both changed; aborting
          # silently would report "nothing to sync" and skip the whole pipeline,
          # so the conflict is aborted to leave a clean tree but reported as a
          # result the caller must act on.
          if git rebase main; then
            echo "rebase=clean" >>"$GITHUB_OUTPUT"
          else
            conflicting="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            git rebase --abort
            echo "rebase=conflict" >>"$GITHUB_OUTPUT"
            echo "conflicting=${conflicting}" >>"$GITHUB_OUTPUT"
            echo "::warning::Rebase onto main conflicted on:${conflicting} The sync branch was reset to main so mirroring can still run."
            # A conflicted sync branch cannot carry this run's changes, so restart
            # it from main to keep the branch usable for the tag mirror below.
            git checkout -B "${SYNC_BRANCH}" main
          fi

      - name: Apply upstream snapshot
        id: sync
        continue-on-error: true
        env:
          MIRROR_BRANCH: ${{ env.SYNC_BRANCH }}
          UPSTREAM_REMOTE: upstream
          UPSTREAM_BRANCH: ${{ env.UPSTREAM_BRANCH }}
        run: |
          set +e
          bash .github/scripts/sync-upstream.sh
          status=$?
          set -e
          # A non-zero exit reports a preserved-path conflict; the check step
          # already stopped, so the branch is still committed and reviewed.
          echo "conflicted=$([ $status -ne 0 ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          if [ -f sync-report.json ]; then
            echo "upstream_sha=$(python3 -c 'import json;print(json.load(open("sync-report.json"))["upstreamSha"])')" >>"$GITHUB_OUTPUT"
            # The report status distinguishes an upstream advance from a
            # preserved-path conflict. Downstream jobs gate on it rather than on
            # the staged-file comparison below, because that comparison cannot
            # tell an upstream source change apart from a rewrite of this job's
            # own tracked bookkeeping.
            echo "status=$(python3 -c 'import json;print(json.load(open("sync-report.json"))["status"])')" >>"$GITHUB_OUTPUT"
          fi
          # Stage everything the sync produced, then compare against HEAD. The
          # state file is untracked on a fresh branch, so a plain `git diff` would
          # report no change and the commit step would be skipped. The report is
          # gitignored and never becomes part of the commit.
          git add -A
          # The state file is tracked on the branch and rewritten every run, so it
          # would otherwise make this flag true even when upstream changed nothing.
          git reset -q -- .sync-state 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Commit synchronised sources
        if: steps.sync.outputs.changed == 'true'
        run: |
          short="${GITHUB_SHA::7}"
          # The state file is tracked on the sync branch so the next run reads the
          # upstream revision this branch last consumed instead of guessing.
          git commit -m "chore(sync): advance vendored upstream to ${short}" \
                     -m "Automated mirror update produced by .github/workflows/upstream-sync.yml." \
                     -m "Upstream-Revision: ${{ steps.upstream.outputs.sha }}"

      - name: Push sync branch
        if: steps.sync.outputs.changed == 'true'
        run: |
          git push --force-with-lease origin "${SYNC_BRANCH}"

      - name: Open or refresh sync pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICTED: ${{ steps.sync.outputs.conflicted }}
        run: |
          title="chore(sync): upstream ${UPSTREAM_REPOSITORY} -> ${GITHUB_RUN_ID}"
          body_file="$(mktemp)"
          {
            echo "## Automated upstream synchronisation"
            echo
            echo "Upstream revision: \`${{ steps.upstream.outputs.sha }}\`"
            echo
            if [ "${CONFLICTED}" = "true" ]; then
              echo "### Review required"
              echo
              echo "Upstream modified at least one path this repository preserves locally."
              echo "Resolve the conflict in \`sync-report.json\` before merging; the \`sync-conflict\` label keeps CI blocked."
            else
              echo "No preserved path was touched by upstream, so this pull request is expected to merge cleanly."
            fi
            echo
            echo "Generated by \`.github/workflows/upstream-sync.yml\`."
          } >"$body_file"

          # A label that does not exist makes `gh pr create --label` fail, and
          # the failure would leave no pull request behind while the run still
          # looked successful. The names come from .upstream-sync.json, which is
          # the single place they are declared, so they are read and ensured here
          # rather than assumed to have been created by hand during setup.
          read -r SYNC_LABEL CONFLICT_LABEL < <(python3 - <<'PY'
          import json
          meta = json.load(open(".upstream-sync.json"))
          print(meta["mirror"]["syncLabel"], meta["mirror"]["conflictLabel"])
          PY
          )
          ensure_label() {
            gh label create "$1" --description "$2" --color "$3" --force >/dev/null 2>&1 || true
          }
          ensure_label "${SYNC_LABEL}" "Opened by the automated upstream synchronisation workflow" "0E8A16"
          ensure_label "${CONFLICT_LABEL}" "Upstream touched a path this distribution preserves; resolve before merging" "B60205"

          existing="$(gh pr list --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number' || true)"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "${title}" --body-file "${body_file}"
          else
            gh pr create --base main --head "${SYNC_BRANCH}" \
              --title "${title}" --body-file "${body_file}" \
              --label "${SYNC_LABEL}"
          fi

          if [ "${CONFLICTED}" = "true" ]; then
            gh pr edit "${SYNC_BRANCH}" --add-label "${CONFLICT_LABEL}" || true
          fi

      - name: Merge clean sync automatically
        id: automerge
        if: >-
          steps.sync.outputs.changed == 'true' &&
          steps.sync.outputs.status == 'advanced'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A clean advance carries no preserved-path conflict, so it can land
          # without a human. The squash keeps main linear and the branch is
          # deleted so the next run recreates it from the new base; leaving it
          # behind would make every later rebase replay this commit.
          if gh pr merge "${SYNC_BRANCH}" --squash --delete-branch; then
            echo "merged=true" >>"$GITHUB_OUTPUT"
            echo "::notice::Upstream advance merged into main automatically."
          else
            # A protected branch that requires review, or a missing pull request,
            # leaves the change waiting for a human. That is a reviewable state
            # rather than a failed sync, so the run keeps its success and the
            # reason is recorded where the next reader looks.
            echo "merged=false" >>"$GITHUB_OUTPUT"
            echo "::warning::Automatic merge of ${SYNC_BRANCH} did not apply; the pull request stays open for manual review."
          fi

      - name: Summary
        run: |
          {
            echo "### Upstream sync"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Upstream revision | \`${{ steps.upstream.outputs.sha }}\` |"
            echo "| Status | ${{ steps.sync.outputs.status }} |"
            echo "| Changed | ${{ steps.sync.outputs.changed }} |"
            echo "| Conflict | ${{ steps.sync.outputs.conflicted }} |"
            echo "| Auto-merged | ${{ steps.automerge.outputs.merged || 'no' }} |"
          } >>"$GITHUB_STEP_SUMMARY"

  mirror-tags:
    name: Mirror upstream release tags
    runs-on: ubuntu-latest
    needs: sync
    # Tag mirroring is independent of whether the source snapshot changed: a
    # manual run or a scheduled sweep must still pick up upstream releases that
    # were tagged since the last pass. Only a hard failure of the sync job, or a
    # run that produced no usable revision, skips this.
    if: >-
      ${{
        always() &&
        needs.sync.result == 'success' &&
        github.event_name != 'pull_request'
      }}
    outputs:
      tags: ${{ steps.tags.outputs.created }}
    # A mirrored tag points at an upstream commit, and those commits carry
    # upstream's own .github/workflows files. GitHub refuses to let a token
    # create a tag whose target tree touches a workflow file unless the token
    # holds the workflows permission, which the repository default withholds
    # even when contents is granted. Without it every tag push is rejected and
    # the mirror silently stays empty.
    permissions:
      contents: write
      workflows: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Annotated tags need a committer identity. This job creates its own
      # checkout, so it inherits no identity from the synchronise job.
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # The script adds the remote itself when it is absent, so an unconditional
      # `git remote add` would fail on a runner that already has it configured.
      - id: tags
        env:
          PUSH_TAGS: 'true'
          # Upstream carries years of release tags. Mirroring the newest few per
          # run keeps a first sync from queueing an image build for every tag at
          # once, and later runs continue from the backlog. Set to 0 to mirror
          # every outstanding tag in one pass.
          TAG_LIMIT: '5'
        run: |
          created="$(bash .github/scripts/sync-tags.sh)"
          echo "created<<EOF" >>"$GITHUB_OUTPUT"
          echo "${created}" >>"$GITHUB_OUTPUT"
          echo "EOF" >>"$GITHUB_OUTPUT"

  dispatch-builds:
    name: Dispatch release builds
    runs-on: ubuntu-latest
    needs: mirror-tags
    if: ${{ needs.mirror-tags.outputs.tags != '' }}
    steps:
      - name: Trigger image build per mirrored tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.mirror-tags.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            gh workflow run build-images.yml --ref "${tag}" -f release_tag="${tag}"
          done <<<"${TAGS}"

  release-tag:
    name: Tag the released version
    runs-on: ubuntu-latest
    needs: sync
    timeout-minutes: 15
    # Tagging depends on the synchronised sources having reached main. When the
    # merge waited for review there is nothing on main to release yet, and when
    # upstream was already current the version on main is unchanged, so both
    # cases skip rather than tag a revision nobody advanced.
    if: >-
      ${{
        always() &&
        needs.sync.result == 'success' &&
        needs.sync.outputs.status == 'advanced' &&
        needs.sync.outputs.merged == 'true' &&
        github.event_name != 'pull_request'
      }}
    permissions:
      contents: write
      actions: write
      # The tagged commit's tree contains this repository's workflow files, and
      # GitHub rejects a tag whose target touches one unless the creating token
      # holds this permission. The repository default withholds it, so the
      # automatic tag would be refused without the explicit grant.
      workflows: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          # The tag must point at the merge commit on main rather than at the
          # sync branch: the image build resolves the version from the ref it
          # checks out, and a tag left on a deleted branch has no image behind it.
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve and record the release version
        id: version
        run: |
          version="$(bash .github/scripts/version-bump.sh --write)"
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          echo "tag=v${version}" >>"$GITHUB_OUTPUT"

      - name: Commit the revision counter
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The counter has to reach main before the tag is pushed. The tag is
          # created from the ref that main points at here, so a push racing the
          # tag would leave the two describing different commits.
          git add .github/custom-revision
          if git diff --cached --quiet; then
            echo "revision counter already current"
            exit 0
          fi
          git commit -m "chore(release): ${VERSION}" \
                     -m "Records the downstream revision consumed by this release." \
                     -m "[skip ci]"
          git push origin HEAD:main

      - name: Create the release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            # A retried run must not move a published tag: the image for the
            # existing tag is already built, and repointing it would leave the
            # tag and its image describing different commits.
            echo "tag ${TAG} already exists; leaving it in place"
            exit 0
          fi
          # The annotation body carries the upstream revision so a reader can
          # trace any image back to the upstream commit it was built from.
          git tag -a "${TAG}" -m "Downstream release ${VERSION}" \
            -m "Built from upstream revision ${UPSTREAM_SHA}."
          git push origin "${TAG}"

      - name: Dispatch the image build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # The tag push also triggers build-images.yml; this dispatch makes the
          # build run even when the push event is suppressed, and the workflow's
          # concurrency group collapses the two into one run.
          gh workflow run build-images.yml --ref "${TAG}" -f release_tag="${TAG}"

      - name: Summary
        run: |
          {
            echo "### Downstream release"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${{ steps.version.outputs.version }}\` |"
            echo "| Tag | \`${{ steps.version.outputs.tag }}\` |"
            echo "| Upstream revision | \`${{ needs.sync.outputs.upstream_sha }}\` |"
          } >>"$GITHUB_STEP_SUMMARY"
