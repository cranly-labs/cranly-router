name: Probe Token Scopes
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== label create in a checkout ==="
          gh label create probe-label --description "probe" --color "0E8A16" --force 2>&1 || true
          echo "=== label list ==="
          gh label list --limit 3 2>&1 | head -5 || true
